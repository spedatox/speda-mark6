[project]
name = "speda-mark-vi"
version = "0.1.0"
description = "SPEDA Mark VI — backend core of the Specialized Personal Executive Digital Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "tzdata>=2024.1",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "anthropic>=0.50.0",
    "httpx>=0.28.0",
    "jsonschema>=4.23.0",
    "google-auth[requests]>=2.38.0",
    "mcp==2.3.0",
    "python-json-logger>=2.0.0",
    "python-multipart>=0.0.20",
    "websockets>=13.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow>=11.0",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "python-pptx>=1.0",
    "weasyprint>=68.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "forge"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
asyncio_mode = "auto"
