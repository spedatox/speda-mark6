<svg xmlns="http://www.w3.org/2000/svg" class="mkvi-diagram" viewBox="0 0 560 555" role="img" aria-labelledby="title desc">
  <title id="title">What triggers the work?</title>
  <desc id="desc">Expected demand triggers forecasting and stock positioning. The actual customer order triggers allocation, picking, packing and delivery.</desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="mkvi-arrow" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>
  <text class="mkvi-heading" x="32" y="52">What triggers the work?</text>
  <path class="mkvi-divider" d="M32 72 H528"/>

  <text class="mkvi-branch" x="32" y="125">PUSH</text>
  <text class="mkvi-note" x="32" y="153">Expected demand</text>
  <rect class="mkvi-node" x="220" y="92" width="308" height="74" rx="12"/>
  <text class="mkvi-label" x="244" y="122">Forecast</text>
  <text class="mkvi-note" x="244" y="150">Estimate demand</text>
  <path class="mkvi-link" d="M374 171 V193" marker-end="url(#tip)"/>
  <rect class="mkvi-node" x="220" y="198" width="308" height="74" rx="12"/>
  <text class="mkvi-label" x="244" y="228">Make and position</text>
  <text class="mkvi-note" x="244" y="256">Stock near likely buyers</text>

  <path class="mkvi-divider" d="M184 307 H356 M392 307 H528"/>
  <text class="mkvi-branch" x="32" y="313">Customer order</text>
  <path class="mkvi-link" d="M374 278 V337" marker-end="url(#tip)"/>

  <text class="mkvi-branch" x="32" y="376">PULL</text>
  <text class="mkvi-note" x="32" y="404">Actual order</text>
  <rect class="mkvi-accept" x="220" y="343" width="308" height="74" rx="12"/>
  <text class="mkvi-label" x="244" y="373">Allocate</text>
  <text class="mkvi-note" x="244" y="401">Select the ordered size</text>
  <path class="mkvi-link" d="M374 422 V444" marker-end="url(#tip)"/>
  <rect class="mkvi-accept" x="220" y="449" width="308" height="74" rx="12"/>
  <text class="mkvi-label" x="244" y="479">Pick and pack</text>
  <text class="mkvi-note" x="244" y="507">Deliver to the buyer</text>
</svg>
