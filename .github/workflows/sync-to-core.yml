name: sync-to-core

# Publish filtered commits to Core's machine-owned branch for a reviewed PR.
# Preferred: CORE_SYNC_SSH_KEY, a write deploy key for Core only. Core's receiver
# opens the PR with its own GITHUB_TOKEN. CORE_SYNC_TOKEN remains a fallback.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      since:
        description: "Re-carry from this full-build SHA instead of Core's recorded state"
        required: false
        type: string
concurrency:
  group: sync-to-core
  cancel-in-progress: false
permissions:
  contents: read
env:
  CORE_REPO: spedatox/speda-mark6-core
  SYNC_BRANCH: sync/from-full-build
jobs:
  test-replay:
    name: Verify replay safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/sync/test_replay.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
  sync:
    needs: test-replay
    name: Publish a carry branch to Core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require configured sync access
        id: access
        env:
          SSH_KEY: ${{ secrets.CORE_SYNC_SSH_KEY }}
          TOKEN: ${{ secrets.CORE_SYNC_TOKEN }}
        run: |
          if [ -n "$SSH_KEY" ]; then
            echo "mode=ssh" >> "$GITHUB_OUTPUT"
          elif [ -n "$TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Core sync access is missing. Configure CORE_SYNC_SSH_KEY or CORE_SYNC_TOKEN."
            echo "No commits were synced: Core sync access is missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Check out the full build tooling
        uses: actions/checkout@v4
        with:
          path: full
      - name: Check out Core main
        uses: actions/checkout@v4
        with:
          repository: spedatox/speda-mark6-core
          ref: main
          ssh-key: ${{ secrets.CORE_SYNC_SSH_KEY }}
          token: ${{ secrets.CORE_SYNC_TOKEN || github.token }}
          fetch-depth: 0
          path: core
      - name: Fetch the full build
        working-directory: core
        env:
          FULL_REPO: ${{ github.repository }}
        run: |
          git remote add full "https://github.com/$FULL_REPO.git"
          git fetch --no-tags full main
      - name: Replay filtered commits and publish the carry branch
        id: replay
        working-directory: core
        env:
          SINCE_INPUT: ${{ inputs.since }}
          FULL_REPO: ${{ github.repository }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash "$GITHUB_WORKSPACE/full/.github/sync/replay.sh"
      - name: Open or update the carry PR with the legacy token
        if: steps.access.outputs.mode == 'token' && steps.replay.outputs.should_pr == 'true'
        working-directory: core
        env:
          GH_TOKEN: ${{ secrets.CORE_SYNC_TOKEN }}
          REPORT_FILE: .github/sync-report.json
        run: bash "$GITHUB_WORKSPACE/full/.github/sync/open-pr.sh"
      - name: Report the carry and surface any blocked commit
        env:
          CARRIED: ${{ steps.replay.outputs.carried }}
          SKIPPED: ${{ steps.replay.outputs.skipped }}
          BLOCKED: ${{ steps.replay.outputs.blocked }}
          SHOULD_PR: ${{ steps.replay.outputs.should_pr }}
        run: |
          {
            echo "Carried: $CARRIED. Skipped: $SKIPPED."
            if [ "$SHOULD_PR" = "true" ]; then
              echo "Published to [Core's carry branch](https://github.com/$CORE_REPO/tree/$SYNC_BRANCH)."
              echo "[Core pull requests](https://github.com/$CORE_REPO/pulls) and [PR receiver](https://github.com/$CORE_REPO/actions/workflows/receive-core-sync.yml)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$BLOCKED" ]; then
            echo "::error::Core carry stopped at $BLOCKED. Later commits remain pending; review the carry PR."
            exit 1
          fi
