name: speda-go

# SPEDA GO release pipeline. Every push to main that touches packages/speda-go
# builds a signed release APK, mirrors the package into the standalone repo
# (github.com/spedatox/speda-go), and publishes the APK as a Release there.
#
# speda-mark6 is the source of truth; the standalone repo is a downstream mirror.
# Never hand-edit files in spedatox/speda-go — the next sync overwrites them.
# The ONE deliberate exception is its README.md, which the mirror leaves alone so
# the standalone repo can keep its own front page.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SPEDA_GO_TOKEN             fine-grained PAT, repo spedatox/speda-go only,
#                              permission "Contents: Read and write"
#   SPEDA_GO_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   SPEDA_GO_KEYSTORE_PASSWORD keystore password
#   SPEDA_GO_KEY_ALIAS         key alias inside the keystore
#   SPEDA_GO_KEY_PASSWORD      key password
#
# The keystore itself lives OFF the repo. Lose it and you can never ship an
# upgrade over an already-installed SPEDA GO again — only a full uninstall.

on:
  push:
    branches: [main]
    paths:
      - "packages/speda-go/**"
      - ".github/workflows/speda-go.yml"
  workflow_dispatch: {}

# Serialize: two overlapping runs would race on the downstream push. Never
# cancel in flight — a killed run can leave the mirror pushed but unreleased.
concurrency:
  group: speda-go-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, mirror, release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets are present
        env:
          TOKEN: ${{ secrets.SPEDA_GO_TOKEN }}
          KEYSTORE: ${{ secrets.SPEDA_GO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ]    || { echo "::error::SPEDA_GO_TOKEN is not set"; exit 1; }
          [ -n "$KEYSTORE" ] || { echo "::error::SPEDA_GO_KEYSTORE_BASE64 is not set"; exit 1; }

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          base=$(sed -n 's/^spedaGoVersion=//p' packages/speda-go/gradle.properties)
          [ -n "$base" ] || { echo "::error::spedaGoVersion missing from gradle.properties"; exit 1; }
          echo "name=${base}-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "tag=v${base}-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      # No gradlew wrapper jar is committed (see docs/ANDROID_PORT_PLAN.md), so
      # the Gradle version is pinned here instead. Keep it in step with the
      # distribution used locally.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SPEDA_GO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/speda-go-release.jks"

      - name: Unit tests
        working-directory: packages/speda-go
        run: gradle --no-daemon :designsystem:testDebugUnitTest :app:testDebugUnitTest

      - name: Assemble signed release APK
        working-directory: packages/speda-go
        env:
          SPEDA_GO_BUILD_NUMBER: ${{ github.run_number }}
          SPEDA_GO_KEYSTORE_FILE: ${{ runner.temp }}/speda-go-release.jks
          SPEDA_GO_KEYSTORE_PASSWORD: ${{ secrets.SPEDA_GO_KEYSTORE_PASSWORD }}
          SPEDA_GO_KEY_ALIAS: ${{ secrets.SPEDA_GO_KEY_ALIAS }}
          SPEDA_GO_KEY_PASSWORD: ${{ secrets.SPEDA_GO_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Stage the APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          src=packages/speda-go/app/build/outputs/apk/release/app-release.apk
          [ -f "$src" ] || { echo "::error::release APK not produced"; exit 1; }
          # Refuse to ship an unsigned APK — apksigner is in the runner's SDK.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$src" > /dev/null
          out="$RUNNER_TEMP/speda-go-${VERSION}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: speda-go-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Mirror from `git archive`, not the working tree: it carries only tracked
      # files, so build/, .gradle/ and the decoded keystore can never leak
      # downstream. --delete makes the mirror exact; README.md is held back.
      - name: Mirror packages/speda-go → spedatox/speda-go
        id: mirror
        env:
          GIT_TOKEN: ${{ secrets.SPEDA_GO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src"
          git archive "${{ github.sha }}:packages/speda-go" | tar -x -C "$RUNNER_TEMP/src"

          git clone --depth 1 \
            "https://x-access-token:${GIT_TOKEN}@github.com/spedatox/speda-go.git" \
            "$RUNNER_TEMP/target"

          rsync -a --delete --exclude '/.git/' --exclude '/README.md' \
            "$RUNNER_TEMP/src/" "$RUNNER_TEMP/target/"

          cd "$RUNNER_TEMP/target"
          git config user.name "speda-mark6 sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No downstream changes; keeping $(git rev-parse HEAD)."
          else
            subject=$(cd "$GITHUB_WORKSPACE" && git log -1 --pretty=%s "${{ github.sha }}")
            git commit -m "sync: speda-mark6@${GITHUB_SHA:0:7} — ${subject}"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.SPEDA_GO_TOKEN }}
          VERSION: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Notes via file: an inline --notes string would carry this step's YAML
          # indentation into the release body and markdown would read it as code.
          {
            printf 'Automated build from speda-mark6@%s.\n\n' "${GITHUB_SHA:0:7}"
            printf 'Signed release APK — installs over any previous SPEDA GO release.\n'
          } > "$RUNNER_TEMP/notes.md"
          # Re-running a workflow reuses its run number, so the tag may already
          # exist. Replace the asset in place rather than deleting the release.
          if gh release view "$TAG" --repo spedatox/speda-go > /dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.path }}" \
              --repo spedatox/speda-go --clobber
          else
            gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
              --repo spedatox/speda-go \
              --target "${{ steps.mirror.outputs.sha }}" \
              --title "SPEDA GO $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
