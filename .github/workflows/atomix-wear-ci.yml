name: Atomix Wear CI

# The watch module lives inside this monorepo but is a self-contained Gradle
# build, so it is scoped by path rather than run on every backend change.
on:
  push:
    branches: [main]
    paths:
      - "packages/atomix-wear/**"
      - ".github/workflows/atomix-wear-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/atomix-wear/**"
      - ".github/workflows/atomix-wear-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/atomix-wear

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Absent secrets are a supported configuration, not a failure: the app is
      # designed to build and run with no Igor endpoint, collecting locally and
      # queueing. That is exactly what a fork or an untrusted PR gets, since
      # GitHub withholds secrets from those by design.
      - name: Write local.properties (Igor config)
        env:
          IGOR_BASE_URL: ${{ secrets.IGOR_BASE_URL }}
          IGOR_API_KEY: ${{ secrets.IGOR_API_KEY }}
        run: |
          cat >> local.properties <<EOF
          IGOR_BASE_URL=$IGOR_BASE_URL
          IGOR_API_KEY=$IGOR_API_KEY
          EOF

      - name: Write google-services.json (Firebase)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Firebase config written — push wake will be compiled in."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set; building without Firebase."
          fi

      # Non-fatal, and deliberately so: this reports whether the ingest endpoint
      # this app exists to feed is actually reachable with the configured key.
      # A red cross here would say "the network was down", not "the code is
      # wrong", so it warns instead.
      - name: Smoke-test the ingest endpoint
        env:
          IGOR_BASE_URL: ${{ secrets.IGOR_BASE_URL }}
          IGOR_API_KEY: ${{ secrets.IGOR_API_KEY }}
        continue-on-error: true
        run: |
          if [ -z "$IGOR_BASE_URL" ]; then
            echo "IGOR_BASE_URL not set; skipping reachability check."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            -H "X-API-Key: $IGOR_API_KEY" -H "Accept: application/json" \
            "${IGOR_BASE_URL%/}/health/status")
          echo "GET /health/status -> HTTP $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Igor reachable and key accepted."
          else
            echo "::warning::Igor did not return 2xx (got $code). The app still builds and queues locally; this step never fails the build."
          fi

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      # R8 full mode and lintVitalRelease are where the release-only failures
      # live — an unsigned artifact is fine, the point is that it compiles and
      # shrinks cleanly.
      - name: Assemble release (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: atomix-wear-debug
          path: packages/atomix-wear/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
