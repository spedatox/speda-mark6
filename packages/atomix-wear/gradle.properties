# Project-wide Gradle settings.

# 4G and a bigger metaspace: AGP 8.13 + Kotlin 2.3 + the Compose compiler in one
# daemon will thrash at the old 2G ceiling and silently fall back to slower
# non-incremental compilation.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# R8 in full mode. On a watch app the dex size reduction translates directly
# into faster class loading at cold start.
android.enableR8.fullMode=true

kotlin.code.style=official
kotlin.incremental=true
