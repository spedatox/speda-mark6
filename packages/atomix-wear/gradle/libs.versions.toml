[versions]
# ── Build tooling ────────────────────────────────────────────────────────────
# AGP held on the 8.x line, matching Ultron Wear. AGP 9 is a build-system
# release and changes nothing the watch executes at runtime.
agp = "8.13.2"
kotlin = "2.3.21"

# ── Compose & Wear ───────────────────────────────────────────────────────────
composeBom = "2026.06.01"
# compose-material3, NOT the superseded compose-material.
wearCompose = "1.6.2"
tiles = "1.5.0"
watchface = "1.2.1"

# ── Health ───────────────────────────────────────────────────────────────────
# UNVERIFIED PINS — see docs/ATOMIX_WEAR.md §8.2. These two are the first thing
# to check when this module is built for the first time: resolve them against
# current stable, and confirm on the actual Galaxy Watch which passive DataTypes
# it exposes before trusting BiometricSource's catalog. Do not assume.
healthServices = "1.1.0"
healthConnect = "1.2.0"

# ── AndroidX ─────────────────────────────────────────────────────────────────
activityCompose = "1.11.0"
coreKtx = "1.17.0"
lifecycle = "2.9.4"
coreSplashscreen = "1.0.1"
workManager = "2.10.5"
profileinstaller = "1.4.1"
# Constraint only — this app has no Fragments. See app/build.gradle.kts.
fragment = "1.8.9"

# ── Google / Firebase ────────────────────────────────────────────────────────
firebaseBom = "34.16.0"
googleServices = "4.5.0"

# ── Kotlin ecosystem ─────────────────────────────────────────────────────────
coroutines = "1.10.2"
serialization = "1.9.0"

# Tiles' TileService returns a Guava ListenableFuture, and Health Services'
# *Async methods do the same — a hard requirement of both APIs.
guava = "33.4.8-android"

[libraries]
# Compose (BOM-managed)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

# Wear Compose — Material 3 line
wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "wearCompose" }

# Wear platform surfaces
tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "tiles" }
tiles-material = { group = "androidx.wear.tiles", name = "tiles-material", version.ref = "tiles" }
watchface-complications-data-source-ktx = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version.ref = "watchface" }

# Health — the point of this application
health-services-client = { group = "androidx.health", name = "health-services-client", version.ref = "healthServices" }
health-connect-client = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }

# AndroidX
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }

# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
# FCM targets by Installation ID; this is where FirebaseInstallations lives.
firebase-installations = { group = "com.google.firebase", name = "firebase-installations" }

# Kotlin ecosystem
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
# Health Services exposes its API as *Async methods returning Guava
# ListenableFuture. This provides `.await()` for them. Deliberately preferred
# over the suspend extensions some Health Services versions also ship: the
# ListenableFuture surface is stable across every version that has the client
# at all, which matters while the pin above is still unverified (§8.2).
coroutines-guava = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-guava", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
