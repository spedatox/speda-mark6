[project]
name = "orion-spark"
version = "0.1.0"
description = "Orion Spark — Lightweight host-level reliability watchdog for Speda Mark VI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "pydantic>=2.6.0",
]

[project.scripts]
orion-spark = "orion_spark.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orion_spark"]
