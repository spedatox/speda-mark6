services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-speda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-speda}
      POSTGRES_DB: ${POSTGRES_DB:-speda}
    ports:
      # localhost-only — the database is NEVER exposed to the internet. The app
      # reaches it over the internal compose network (postgres:5432) regardless.
      # For admin, tunnel in: ssh -L 5432:127.0.0.1:5432 <server>
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speda"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .                            # repo root — uv workspace + lock live here
      dockerfile: packages/igor/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      # Single source of secrets — same file the dev backend (uvicorn) reads.
      - packages/igor/.env
    environment:
      # SQLite in production (single-user workload). This MUST be an explicit
      # override, not a removal: the server's packages/igor/.env still defines a
      # Postgres DATABASE_URL, and compose's `environment:` is the only layer that
      # outranks `env_file:`. Four slashes = absolute path; it maps through the
      # bind mount below to the server's /opt/speda/speda.db. The postgres service
      # is left dormant (app no longer depends on it); remove it once confident.
      DATABASE_URL: sqlite+aiosqlite:////root/.speda/speda.db
      PLAYWRIGHT_MCP_URL: http://playwright-mcp:3000
      SANDBOX_URL: http://sandbox:9000
    volumes:
      - /tmp/speda_outputs:/tmp/speda_outputs
      # Host dir holding speda.db → container's data dir. A directory (not the
      # bare file) so WAL's speda.db-wal / speda.db-shm sidecars persist too.
      # Also carries the system_ops SSH key (host_ops_key) + known_hosts.
      - /opt/speda:/root/.speda
    # system_ops host bridge: lets the container resolve the real host as
    # host.docker.internal so Orion/Optimus can SSH out for server maintenance.
    # On Linux this needs the explicit host-gateway mapping (it is automatic only
    # on Docker Desktop). Harmless when system_ops_host is unset.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The automation organ — n8n owns ALL scheduling and polling (CLAUDE.md).
  # SPEDA composes workflows over its REST API; fired watchers call back into
  # the app's /trigger endpoint over this internal network.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      # localhost-only — n8n is never published by this port mapping. It stays
      # here so the SSH tunnel keeps working as a fallback:
      #   ssh -L 5678:127.0.0.1:5678 <server>, then open http://localhost:5678
      # Public access, when configured, goes through Caddy over the internal
      # network instead (see N8N_DOMAIN in deploy.sh).
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=${TZ:-UTC}
      - TZ=${TZ:-UTC}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
      # Behind Caddy, n8n cannot infer its own public URL — it would generate
      # editor links, OAuth callbacks and webhook URLs pointing at localhost:5678.
      # These pin it to the public hostname. All empty when N8N_DOMAIN is unset,
      # which leaves n8n's own localhost defaults intact.
      - N8N_HOST=${N8N_DOMAIN:-}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_EDITOR_BASE_URL=${N8N_PUBLIC_URL:-}
      - WEBHOOK_URL=${N8N_PUBLIC_URL:-}
      # Exactly one proxy (Caddy) sits in front, so trust one hop of
      # X-Forwarded-For. Without this n8n sees every client as the Docker
      # gateway IP, which breaks its login rate limiting.
      - N8N_PROXY_HOPS=${N8N_PROXY_HOPS:-0}
      # Credentials the imported workflows read as {{ $env.* }} when they call
      # back into Igor — /trigger and /mail/watch/* both require X-API-Key, and
      # the n8n-facing ones additionally require X-N8N-Secret. deploy.sh exports
      # these from packages/igor/.env so there is still exactly one secret file.
      - SPEDA_API_KEY=${SPEDA_API_KEY:-}
      - N8N_SECRET=${N8N_SECRET:-}
      # …and the permission to actually READ them from an expression. n8n 2.x
      # blocks {{ $env.* }} by default and fails the run with "access to env
      # vars denied" — which is why only composer-generated workflows worked
      # before: those bake the literal secret into the node. Repo-committed
      # workflows cannot do that (the key would be in git), so they read $env
      # and need this. Only the owner can author workflows here.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n

  # SPEDA's "capable computer" — isolated container it runs commands in.
  # No host mounts, no secrets, resource-limited, reachable only on this network.
  sandbox:
    build: ./packages/sandbox
    # No host port mapping — only the app talks to it over the internal network.
    expose:
      - "9000"
    volumes:
      - sandbox_workspace:/workspace
    # Resource ceilings so a runaway command can't starve the host.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # H.İ.S.A.R. — the owner's file vault, served at hisar.$DOMAIN.
  # Deployed from a sibling clone of spedatox/hisar-mk1 (option (b) of the
  # placement plan). Only starts with `--profile hisar`, which deploy.sh enables
  # when ../hisar-mk1/.env exists — so a server without Hisar is unaffected.
  hisar:
    build: ../hisar-mk1
    profiles: ["hisar"]
    restart: unless-stopped
    expose:
      - "8600"
    # Hisar's own secrets live with Hisar, never in Igor's .env.
    env_file:
      - ../hisar-mk1/.env
    environment:
      # Container-side paths — these MUST outrank the .env, whose
      # HISAR_SANDBOX_ROOT is the *host* path of the same directory.
      HISAR_SANDBOX_ROOT: /vault
      HISAR_STATIC_DIR: /app/dist
    volumes:
      # The vault is the only writable mount. Forge writes into
      # Forge/workspaces of this same host directory, directly.
      - /opt/hisar/vault:/vault
    security_opt:
      - no-new-privileges:true

  # Reverse proxy + automatic HTTPS for your domain. Only starts when you run
  # with `--profile domain` and DOMAIN is set (deploy.sh does this for you).
  caddy:
    image: caddy:2-alpine
    profiles: ["domain"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Generated site blocks for optional peers (see Caddyfile's import).
      # Gitignored — deploy.sh writes them from each peer's own .env.
      - ./caddy-sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  sandbox_workspace:
  n8n_data:
  caddy_data:
  caddy_config:
