services:
  app:
    image: ${SPEDA_IMAGE:-speda-renovated:local}
    build:
      context: .
      target: production
    restart: unless-stopped
    ports:
      - "${SPEDA_BIND_ADDRESS:-127.0.0.1}:${SPEDA_HTTP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/speda.db
      SPEDA_DATA_DIR: /data
    stop_grace_period: 45s
    init: true
    volumes:
      - speda_data:/data
      - /tmp/speda_outputs:/tmp/speda_outputs

volumes:
  speda_data:
